# Veroeffentlicht den Inhalt von web/ als GitHub-Pages-Seite.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Commit-Kennung an CSS und JS haengen, damit kein Browser nach einem Update
      # neue index.html mit alten, noch zwischengespeicherten Dateien mischt.
      - run: sed -i "s/__VERSION__/${GITHUB_SHA::7}/g" web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
